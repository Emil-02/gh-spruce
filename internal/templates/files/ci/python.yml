name: CI

on:
  push:
    branches: [{{.Branch}}]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
{{- if .Dir}}
    defaults:
      run:
        working-directory: {{.Dir}}
{{- end}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip ruff{{if .HasTests}} pytest{{end}}
{{- if .Requirements}}
          pip install -r {{.Requirements}}
{{- end}}
      - name: Check for syntax errors and undefined names
        run: ruff check --select=E9,F63,F7,F82 --output-format=github .
{{- if .HasTests}}
      - name: Test
        run: pytest
{{- end}}
