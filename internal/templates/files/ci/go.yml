name: CI

on:
  push:
    branches: [{{.Branch}}]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
{{- if .Dir}}
    defaults:
      run:
        working-directory: {{.Dir}}
{{- end}}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: {{if .Dir}}{{.Dir}}/{{end}}go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...
